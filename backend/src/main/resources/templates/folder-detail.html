<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'blackbox · ' + ${folder.name}">blackbox · 폴더</title>
    <th:block th:replace="~{fragments/common :: head-assets}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/common :: header}"></div>

    <a href="/folders" class="back-link">← 폴더 목록</a>
    <h1 th:text="${folder.name}">폴더</h1>
    <div class="tagline">
        <span th:text="${#lists.size(bookmarks)} + '건'">0건</span>
        &nbsp;·&nbsp;
        <button type="button" class="tag-edit-toggle folder-rename-btn"
                th:attr="data-folder-id=${folder.id}, data-folder-name=${folder.name}">폴더 이름 수정</button>
        &nbsp;·&nbsp;
        <button type="button" class="tag-edit-toggle folder-delete-btn"
                th:attr="data-folder-id=${folder.id}, data-redirect='/folders'">폴더 삭제</button>
    </div>

    <div th:if="${#lists.isEmpty(bookmarks)}" class="empty">이 폴더에 담긴 북마크가 없습니다.</div>
    <div class="bookmark-list" th:unless="${#lists.isEmpty(bookmarks)}">
        <th:block th:each="b : ${bookmarks}">
            <div th:replace="~{fragments/bookmark-card :: card(${b})}"></div>
        </th:block>
    </div>

    <script src="/js/tag-editor.js"></script>
    <script src="/js/archive-toggle.js"></script>
    <script src="/js/folder-picker.js"></script>
    <script src="/js/folder-actions.js"></script>
</body>
</html>
