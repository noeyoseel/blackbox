<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="'blackbox · 검색: ' + ${q}">blackbox · 검색</title>
    <th:block th:replace="~{fragments/common :: head-assets}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/common :: header}"></div>

    <h1 th:text="'&quot;' + ${q} + '&quot;'">검색어</h1>
    <div class="tagline">
        <span th:text="${totalCount} + '건 찾음'">0건</span>
        <span th:if="${totalPages > 1}" th:text="' · ' + (${page} + 1) + ' / ' + ${totalPages} + ' 페이지'"></span>
        <span class="search-scope">본문과 태그를 함께 찾습니다.</span>
    </div>

    <div th:if="${#strings.isEmpty(q)}" class="empty">헤더의 검색창에 키워드를 입력해보세요.</div>
    <div th:if="${not #strings.isEmpty(q) and #lists.isEmpty(results)}" class="empty">일치하는 북마크가 없습니다.</div>

    <div class="bookmark-list" th:unless="${#lists.isEmpty(results)}">
        <th:block th:each="b : ${results}">
            <div th:replace="~{fragments/bookmark-card :: card(${b})}"></div>
        </th:block>
    </div>

    <div class="pager" th:if="${totalPages > 1}">
        <a class="pager-link" th:if="${page > 0}"
           th:href="@{/search(q=${q}, page=${page - 1})}">← 이전</a>
        <span class="pager-status" th:text="(${page} + 1) + ' / ' + ${totalPages}">1 / 1</span>
        <a class="pager-link" th:if="${page + 1 < totalPages}"
           th:href="@{/search(q=${q}, page=${page + 1})}">다음 →</a>
    </div>

    <script src="/js/tag-editor.js"></script>
    <script src="/js/archive-toggle.js"></script>
</body>
</html>
